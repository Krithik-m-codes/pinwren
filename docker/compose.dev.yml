# Local development database only. Run the app itself with `pnpm dev`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pinwren
      POSTGRES_PASSWORD: pinwren
      POSTGRES_DB: pinwren
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pinwren-dev-db:/var/lib/postgresql/data
volumes:
  pinwren-dev-db:
