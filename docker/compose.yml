# Pinwren self-host: the app + Postgres. Put a TLS reverse proxy in front for production.
#   cp docker/.env.example docker/.env   # fill in the values
#   docker compose -f docker/compose.yml --env-file docker/.env up -d
services:
  pinwren:
    image: ${PINWREN_IMAGE:-pinwren:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${PINWREN_BIND:-127.0.0.1}:${PINWREN_PORT:-3000}:3000"
    environment:
      PINWREN_URL: ${PINWREN_URL:?Set PINWREN_URL to the public URL, e.g. https://feedback.example.com}
      PINWREN_SECRET: ${PINWREN_SECRET:?Set PINWREN_SECRET (openssl rand -base64 48)}
      DATABASE_URL: postgres://pinwren:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/pinwren
      PINWREN_TRUST_PROXY: ${PINWREN_TRUST_PROXY:-1}
      # Unset: first account + invitations only (ADR 0021). false: open sign-up. true: closed.
      PINWREN_DISABLE_SIGNUP: ${PINWREN_DISABLE_SIGNUP:-}
      PINWREN_ADMIN_EMAILS: ${PINWREN_ADMIN_EMAILS:-}
      PINWREN_OUTBOUND_ALLOWLIST: ${PINWREN_OUTBOUND_ALLOWLIST:-}
      # Node processes serving requests; roughly one per CPU core you give the container.
      PINWREN_WORKERS: ${PINWREN_WORKERS:-2}
      # Enterprise licence file inside the container (e.g. /data/pinwren.lic); empty = upload in Settings.
      PINWREN_LICENSE_FILE: ${PINWREN_LICENSE_FILE:-}
    volumes:
      - pinwren-data:/data
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pinwren
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pinwren
    volumes:
      - pinwren-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinwren"]
      interval: 5s
      retries: 10
volumes:
  pinwren-data:
  pinwren-db:
