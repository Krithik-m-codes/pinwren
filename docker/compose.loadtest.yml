# Load test: the self-host stack + k6, on one private network.
#   docker compose -p annota-load -f docker/compose.yml -f docker/compose.loadtest.yml \
#     --env-file docker/loadtest.env up --build --abort-on-container-exit --exit-code-from k6
services:
  annota:
    environment:
      # k6 sends X-Forwarded-For per simulated visitor, so the per-IP rate limit behaves as in production.
      ANNOTA_TRUST_PROXY: "1"
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      ANNOTA_WORKERS: ${ANNOTA_WORKERS:-2}
    deploy:
      resources:
        limits:
          cpus: "${ANNOTA_CPUS:-2}"
          memory: 1g
  db:
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=256MB"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
  k6:
    image: grafana/k6:1.3.0
    depends_on:
      annota:
        condition: service_healthy
    volumes:
      - ../loadtest:/scripts:ro
    environment:
      BASE: http://annota:3000
      DURATION: ${K6_DURATION:-2m}
      READ_RPS: ${K6_READ_RPS:-60}
      INGEST_RPS: ${K6_INGEST_RPS:-25}
      DASH_RPS: ${K6_DASH_RPS:-10}
    command: ["run", "/scripts/k6.js"]
