name: Feature request
description: Suggest something Pinwren should do
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and who runs into it (site visitor, client, triager, self-hoster). The use case matters more than the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: How it could work — UI, API, configuration.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you use today, or how other tools (Marker.io, BugHerd, Userback, …) handle it.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Widget
        - Dashboard
        - API / integrations
        - Self-hosting
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this (see CONTRIBUTING.md first).
