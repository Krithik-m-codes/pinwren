name: Labeler

# Labels PRs by the paths they touch (.github/labeler.yml) and keeps the repository's label set in sync
# with .github/labels.yml.
#
# Safe under pull_request_target: actions/labeler reads the changed-file list through the API and never
# checks out or runs PR code.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - .github/labels.yml
  workflow_dispatch:

permissions: {}

jobs:
  label-pr:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true

  sync-labels:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          skip-delete: true
