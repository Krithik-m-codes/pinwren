name: PR title

# PRs are squash-merged, so the title becomes the commit that release-please and the labeller read.
# A malformed title silently breaks the changelog — validate it up front.
#
# Safe under pull_request_target: it reads only the title through the API and never checks out or runs
# PR code. pull_request_target gives it a token on PRs from forks.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            style
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            Start the subject with a lowercase letter: "feat(widget): add a dark launcher", not "Add …".
