name: Docker publish

# Builds the self-host image for linux/amd64 and linux/arm64 and pushes it to GHCR with an SBOM and
# SLSA provenance attached. Called by release-please.yml when an app release (tag vX.Y.Z) is cut; run it
# by hand to re-publish an existing tag.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build (vX.Y.Z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      # Registry names must be lowercase.
      IMAGE: ghcr.io/krithik-m-codes/pinwren
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Pinwren
            org.opencontainers.image.description=Self-hostable visual feedback: pinned comments and annotated bug reports
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          # Refuse to publish an image that can't verify Enterprise licences (docs/release/licence-keys.md).
          build-args: PINWREN_RELEASE=1
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
