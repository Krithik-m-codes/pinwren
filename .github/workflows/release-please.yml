name: Release

# release-please keeps a release PR open for each component (the app at the repo root and
# @pinwren/widget) from Conventional Commits on main. Merging that PR tags the release; this workflow then
# publishes the widget to npm and, for an app release, the Docker image (docker-publish.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only floor: each job re-declares exactly what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      app_release_created: ${{ steps.release.outputs.release_created }}
      app_tag: ${{ steps.release.outputs.tag_name }}
      widget_release_created: ${{ steps.release.outputs['packages/widget--release_created'] }}
      widget_tag: ${{ steps.release.outputs['packages/widget--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # Optional PAT (or GitHub App token): with it the release PR triggers CI. Events created with
          # GITHUB_TOKEN never start other workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    name: Publish the Docker image
    needs: release-please
    if: needs.release-please.outputs.app_release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.release-please.outputs.app_tag }}

  publish-widget:
    name: Publish @pinwren/widget to npm
    needs: release-please
    if: needs.release-please.outputs.widget_release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm --filter @pinwren/widget test
      - name: Build
        run: pnpm --filter @pinwren/widget build
      - name: Publish
        working-directory: packages/widget
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
