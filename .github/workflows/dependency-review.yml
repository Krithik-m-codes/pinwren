name: Dependency review

# Fails a PR that adds a dependency with a known vulnerability (moderate or worse) or a licence that
# can't ship in an AGPL/MIT project. Reads the dependency-graph diff GitHub computes from pnpm-lock.yaml.

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          fail-on-severity: moderate
          # SPDX ids only: the action refuses anything else. Commons Clause has no SPDX id (packages using
          # it declare a LicenseRef), so a reviewer has to spot it in the PR's dependency summary.
          deny-licenses: SSPL-1.0, BUSL-1.1
          comment-summary-in-pr: on-failure
