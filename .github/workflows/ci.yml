name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

# Read-only everywhere: publishing, labelling and releasing live in dedicated workflows with their own
# scoped tokens.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # `pnpm install` runs `prepare`, which would otherwise install git hooks into the runner's checkout.
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Unit tests (core, api, widget)
        run: pnpm test

  cloud-isolation:
    name: Cloud tenant isolation (Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start an isolated database with generated fixture credentials
        shell: bash
        run: |
          fixture_password="$(node -p "require('node:crypto').randomBytes(24).toString('hex')")"
          echo "::add-mask::$fixture_password"
          docker run --detach --name pinwren-isolation --publish 127.0.0.1:5433:5432 \
            --env POSTGRES_USER=pinwren --env POSTGRES_DB=pinwren_isolation \
            --env POSTGRES_PASSWORD="$fixture_password" postgres:${{ matrix.postgres }}-alpine
          printf 'PINWREN_ISOLATION_ADMIN_URL=postgres://pinwren:%s@127.0.0.1:5433/pinwren_isolation\n' "$fixture_password" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if docker exec pinwren-isolation pg_isready -U pinwren; then exit 0; fi
            sleep 1
          done
          docker logs pinwren-isolation
          exit 1
      - name: Real PostgreSQL tenant boundary and provisioning checks
        run: node scripts/tenant-isolation.mjs
      - name: Stop the fixture database
        if: always()
        run: docker rm --force pinwren-isolation || true

  widget-e2e:
    name: Widget E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright
        working-directory: packages/widget
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/widget
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: packages/widget
        run: pnpm exec playwright install-deps chromium
      - name: Build the widget
        run: pnpm --filter @pinwren/widget build
      - name: Playwright (fixture page on :5180, API mocked)
        run: pnpm --filter @pinwren/widget test:e2e
      - name: React wrapper Playwright
        run: pnpm --filter @pinwren/react test:e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: widget-playwright-traces
          path: |
            packages/widget/test-results/
            packages/react/test-results/
          retention-days: 7

  dashboard-e2e:
    name: Dashboard E2E (Playwright + Postgres)
    runs-on: ubuntu-latest
    # ~70 specs against `next dev`, which compiles each route on first visit. Playwright's own global
    # timeout (40 min in CI) fires first, so a hang still ends with a report.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pinwren
          POSTGRES_PASSWORD: pinwren
          POSTGRES_DB: pinwren
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pinwren"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pinwren:pinwren@127.0.0.1:5433/pinwren
      PINWREN_URL: http://localhost:3100
      # Throwaway: only signs sessions inside this job's database.
      PINWREN_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      PINWREN_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install-deps chromium
      # The dashboard serves widget.js from public/; the dev server applies migrations on start.
      - name: Build the widget
        run: pnpm --filter @pinwren/widget build
      - name: Playwright (starts next dev on :3100)
        run: pnpm --filter @pinwren/web test:e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (widget bundles + next build)
        run: pnpm build
      - name: Widget bundle sizes
        run: |
          {
            echo '### @pinwren/widget (gzip)'
            echo '| file | bytes |'
            echo '|---|---:|'
            for f in packages/widget/dist/widget*.js; do
              echo "| $(basename "$f") | $(gzip -c "$f" | wc -c) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  extended-e2e:
    name: Extended E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [website, journey, api-smoke]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pinwren
          POSTGRES_PASSWORD: pinwren
          POSTGRES_DB: pinwren
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pinwren"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pinwren:pinwren@127.0.0.1:5433/pinwren
      PINWREN_URL: http://localhost:3100
      PINWREN_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      PINWREN_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pinwren/widget --filter @pinwren/sdk --filter @pinwren/mcp --filter @pinwren/cli build
      - name: Install Chromium
        if: matrix.suite != 'api-smoke'
        working-directory: apps/www
        run: pnpm exec playwright install --with-deps chromium
      - name: Website accessibility, links and demo
        if: matrix.suite == 'website'
        run: pnpm --filter @pinwren/www test:e2e
      - name: Fresh-install journey
        if: matrix.suite == 'journey'
        shell: bash
        run: |
          pnpm --filter @pinwren/web dev > app.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..120}; do
            if curl --fail --silent http://localhost:3100/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3100/api/health
          pnpm --filter @pinwren/web exec playwright test -c playwright.journey.config.ts
      - name: API smoke
        if: matrix.suite == 'api-smoke'
        env:
          PINWREN_TRUST_PROXY: "1"
          PINWREN_DISABLE_SIGNUP: "false"
          PINWREN_OUTBOUND_ALLOWLIST: "127.0.0.1"
          PINWREN_ADMIN_EMAILS: smoke-admin@example.com,e2e-admin@example.com
        shell: bash
        run: |
          # GitHub reserves GITHUB_* runner variables. Set the mock API on the child process itself.
          GITHUB_API_URL=http://127.0.0.1:4790 pnpm --filter @pinwren/web dev > app.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..120}; do
            if curl --fail --silent http://localhost:3100/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3100/api/health
          node scripts/smoke.mjs http://localhost:3100
      - name: Upload diagnostic logs and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extended-${{ matrix.suite }}-diagnostics
          path: |
            app.log
            apps/www/test-results/
            node_modules/.cache/journey-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: pinwren:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
